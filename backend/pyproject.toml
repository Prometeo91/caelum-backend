[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrologia-backend"
version = "0.1.0"
description = "Backend di calcolo astrologico (FastAPI + Swiss Ephemeris)"
# AGPL perché usa pyswisseph (Swiss Ephemeris di Astrodienst, AGPL):
# il sorgente del backend è pubblicato su github.com/Prometeo91/caelum-backend
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    # Versioni fissate (non intervalli aperti): con dipendenze come
    # fastapi/pydantic/httpx il risolutore di pip può impiegare tempo
    # enorme (o non terminare, "ResolutionTooDeep") a cercare tra le
    # tante versioni storiche compatibili. Queste sono le versioni
    # verificate insieme; per aggiornarle, farlo di proposito e
    # rieseguire i test.
    "fastapi==0.140.13",
    "uvicorn[standard]==0.49.0",
    "pyswisseph==2.10.3.2",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "tzdata==2026.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
